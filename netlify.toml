# Dynamic sitemap listing static pages + all published blog posts.
[[edge_functions]]
  path = "/sitemap.xml"
  function = "sitemap"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# ── Old addresses (SEO audit, Nov 2026) ──
# Google still holds links from the old www site. Before these, each one
# answered 200 with the home page's title and React Router's error screen, so
# Google filed them as duplicate home pages. 301 = moved for good.
[[redirects]]
  from = "/about-us"
  to = "/our-story"
  status = 301
[[redirects]]
  from = "/about"
  to = "/our-story"
  status = 301
[[redirects]]
  from = "/contact-us"
  to = "/contact"
  status = 301
[[redirects]]
  from = "/riders"
  to = "/how-it-works"
  status = 301
# Temporary (302) until the Pittsburgh fun facts post exists. When it is
# published, point this at /blog/<its slug> and change the status to 301.
[[redirects]]
  from = "/fun-facts"
  to = "/blog"
  status = 302

# ── App addresses typed on the main domain ──
# These pages live on app.citybucketlist.com. Until now a wrong-domain link
# still "worked" by landing on the home page; with real 404s below, forward
# them to the app instead so a printed or shared link never dead-ends.
[[redirects]]
  from = "/r/*"
  to = "https://app.citybucketlist.com/r/:splat"
  status = 302
[[redirects]]
  from = "/p/*"
  to = "https://app.citybucketlist.com/p/:splat"
  status = 302
[[redirects]]
  from = "/c/*"
  to = "https://app.citybucketlist.com/c/:splat"
  status = 302
[[redirects]]
  from = "/rider/*"
  to = "https://app.citybucketlist.com/rider/:splat"
  status = 302
[[redirects]]
  from = "/driver/*"
  to = "https://app.citybucketlist.com/driver/:splat"
  status = 302
[[redirects]]
  from = "/partner/*"
  to = "https://app.citybucketlist.com/partner/:splat"
  status = 302
[[redirects]]
  from = "/privacy"
  to = "https://app.citybucketlist.com/privacy"
  status = 302
[[redirects]]
  from = "/download-app"
  to = "/app"
  status = 301
# Branded short link for the CBL Driver Feedback Survey (Google Form). The app
# repo's netlify.toml carries the same rule, but that file configures
# app.citybucketlist.com, so citybucketlist.com/cblsurvey never reached it.
[[redirects]]
  from = "/cblsurvey"
  to = "https://forms.gle/pMtiBGcMYKdoy8EU9"
  status = 302
  force = true

