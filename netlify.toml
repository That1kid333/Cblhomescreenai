[build]
  command = "npm run build"
  publish = "dist"

# Pinned for reproducibility. NOTE: the Aug 13-14 production build failures were
# NOT a Node version problem — Netlify was already on v20.20.2. A stray
# pnpm-workspace.yaml in the repo root made Netlify detect a pnpm workspace and
# install with pnpm (which defaults to --frozen-lockfile in CI), while pnpm-lock.yaml
# had gone stale against package.json since b12bd6f added typescript and
# @types/react-dom via npm. Every local and CI test passed because they all ran
# npm; Netlify was the only environment running pnpm. Both pnpm files were deleted
# so Netlify installs with npm and package-lock.json, matching CI, the build
# command, and local dev. Do NOT reintroduce a pnpm lockfile — regenerating it was
# the previous fix (see 2022829) and it broke again on the next npm-only change.
#
# Oct 22, 2026: moved from 20 to 22. Node 20 reached end of life in April 2026
# and gets no security fixes, including the Oct 21, 2026 Node.js security release
# (CVE-2026-111497, Brotli decoder remote code execution). The Netlify functions
# in netlify/functions run server-side on this version. Keep this on a supported
# LTS line, and keep .github/workflows/ci.yml on the same major.
[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Prerender the blog for crawlers/AI engines: inject real HTML + SEO metadata
# into the SPA shell for /blog and /blog/:slug. Static assets under /blog/*/*
# (images) have multiple path segments, so they don't match /blog/:slug.
[[edge_functions]]
  path = "/blog"
  function = "prerender"

[[edge_functions]]
  path = "/blog/:slug"
  function = "prerender"

[[edge_functions]]
  path = "/attractions"
  function = "prerender"

[[edge_functions]]
  path = "/directory"
  function = "prerender"

# Static marketing pages — prerender real title/meta/OG + hero content so the
# home page and section pages are crawlable (bots / AI engines / social scrapers).
[[edge_functions]]
